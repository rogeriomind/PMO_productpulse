services:
  agent-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmo_agent
      POSTGRES_PASSWORD: pmo_agent
      POSTGRES_DB: pmo_agent
    volumes:
      - pmo_agent_postgres_data:/var/lib/postgresql/data
      - ./app/database/migrations:/docker-entrypoint-initdb.d
    networks:
      - pmo_agent

  api:
    build: .
    restart: unless-stopped
    command: sh -c "python -m app.database.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - agent-postgres
    networks:
      - pmo_agent

  worker:
    build: .
    restart: unless-stopped
    command: sh -c "python -m app.database.migrate && python -m app.workers.message_worker"
    env_file:
      - .env
    depends_on:
      - agent-postgres
    networks:
      - pmo_agent
      - pmo_ai_network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - pmo_agent_caddy_data:/data
      - pmo_agent_caddy_config:/config
    depends_on:
      - api
    networks:
      - pmo_agent

volumes:
  pmo_agent_postgres_data:
  pmo_agent_caddy_data:
  pmo_agent_caddy_config:

networks:
  pmo_agent:
  pmo_ai_network:
    external: true
    name: ${PMO_AI_NETWORK_NAME:-pmo_ai_network}
