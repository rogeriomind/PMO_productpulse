services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pmo_agent
      POSTGRES_PASSWORD: pmo_agent
      POSTGRES_DB: pmo_agent
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/database/migrations:/docker-entrypoint-initdb.d

  api:
    build: .
    command: sh -c "python -m app.database.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres

  worker:
    build: .
    command: sh -c "python -m app.database.migrate && python -m app.workers.message_worker"
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data:
